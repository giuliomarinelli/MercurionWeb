# Example configuration for one autonomous Development Session.

session:
  name: development-session
  timezone: Europe/Rome
  start: "09:00"
  end: "13:00"       # soft deadline
  hard_stop: "14:00" # absolute guardrail

repository:
  integration_branch: develop
  feature_branch_pattern: "feature/{source}"

  git:
    allow_writes: true
    merge_strategy: no-ff
    allow_rebase: false
    allow_force_push: false
    push_feature_branch: true
    delete_feature_branch_on_ci_success: true
    preserve_feature_branch_on_failure: true

  github:
    allow_remote_git_writes: true
    wait_for_merge_ci: true
    ci_failure_policy: revert-merge-and-block

agent:
  host: vscode
  provider: github-copilot
  model: GPT-5.6 Sol
  reasoning: high

  # Autonomous sessions run through GitHub Copilot Chat/Agent in VS Code.
  # `.vscode/settings.json` enables the extension's native OpenAI Responses API
  # context management. For a 272K prompt window the extension computes the
  # server-side compaction threshold as floor(272000 * 0.9) = 244800 tokens.
  context:
    max_prompt_tokens: 272000
    long_context_enabled: false
    management:
      required: true
      provider: openai-responses
      strategy: server-side-compaction
      workspace_setting: github.copilot.chat.responsesApiContextManagement.enabled
      workspace_setting_file: .vscode/settings.json
      required_value: true
      compact_threshold: 244800
      compact_threshold_policy: 90-percent-of-model-max-prompt-tokens

  max_autopilot_continues_per_task: 20
  max_ai_credits_per_task: 100

capabilities:
  browser_validation:
    enabled: true
    mcp_server: chrome-devtools
    mcp_config: .vscode/mcp.json
    required_when_declared_by_task: true

runtime:
  documentation: docs/autonomous-development/RUNTIME.md

  edge:
    base_url: http://localhost:8888
    managed: false
    required: true
    angular_readiness_url: http://localhost:8888/
    nest_readiness_url: http://localhost:8888/health

  managed_processes:
    tox21:
      cwd: ../MercurionTox21
      repository_access: read-only
      watch: false
      command:
        windows: .venv/Scripts/python.exe -m main
        posix: .venv/bin/python -m main

    nest:
      cwd: MercurionWebNode
      repository_access: read-write
      watch: true
      command: npm run start:dev

    angular:
      cwd: MercurionWebNg
      repository_access: read-write
      watch: true
      command: npm run start:dev

  start_order:
    - tox21
    - nest
    - angular

quality:
  # No task implementation starts before a complete baseline check.
  session_start_preflight: true
  before_every_task: true
  before_merge: true
  repair_repository_controlled_failures: true

  # Canonical interface after task 0008 is integrated. GitHub Actions must use
  # the same gate set. The clean install is deliberately separate from ci:check.
  canonical:
    install: npm ci
    check: npm run ci:check

  # Before task 0008 creates the root CI interface, PROTOCOL.md defines the
  # bootstrap package-local checks. Missing required lint/type/test gates are
  # defects to establish/repair, not permission to skip them.
  bootstrap_until_task: "0008"

  # After any remediation, rerun the complete suite rather than only the command
  # that originally failed.
  rerun_full_suite_after_repair: true

workload:
  task_directory: docs/autonomous-development/task
  task_pattern: "[0-9][0-9][0-9][0-9]-*.md"
  series_directory: docs/autonomous-development/series
  series_pattern: "[0-9][0-9][0-9][0-9]-*.md"
  order: filename
  series_file: null
  tasks: []

policy:
  fresh_agent_session_per_task: true

  # Each task owns exactly one feature branch derived from its Source identifier.
  one_feature_branch_per_task: true
  source_required_for_branch_name: true

  # The runner does not start the next task until merge CI succeeds or the failed
  # merge has been reverted and the task has been recorded as BLOCKED.
  serialize_task_integration: true

  finish_current_task_after_deadline: true
  start_new_tasks_after_deadline: false
  stop_when_workload_exhausted: true

  continue_after_blocked_task: true
  require_green_develop_before_next_task: true

ci:
  workflow_file: .github/workflows/ci.yml
  integration_branch: develop
  merge_commit_required: true
  wait_for_exact_merge_sha: true

  on_success:
    finalize_done: true
    delete_feature_branch_local: true
    delete_feature_branch_remote: true

  on_failure:
    stop_progression: true
    revert_merge_commit: true
    wait_for_revert_ci_green: true
    mark_task_blocked: true
    preserve_feature_branch_local: true
    preserve_feature_branch_remote: true

on_finish:
  validate_repository: true
  require_green_develop: true
  generate_report: true
  stop_managed_runtime_processes: true
  report_directory: docs/autonomous-development/reports
