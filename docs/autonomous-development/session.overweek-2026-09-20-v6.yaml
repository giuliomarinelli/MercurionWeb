    - "0085"
    - "0086"
    - "0088"
    - "0106"
    - "0110"
    - "0111"
    - "0112"

task_outcomes:
  persistent:
    - DONE
    - BLOCKED
    - REVERTED
    - SKIPPED_DEPENDENCY
  mutually_exclusive: true
  transient:
    - CI_PENDING
    - WAITING_DEPENDENCY
    - SESSION_CAPABILITY_PAUSE
    - SESSION_BRANCH_COLLISION_PAUSE
    - SESSION_RECOVERY_PENDING
    - BROWSER_PROFILE_RECOVERY_REQUIRED

policy:
  fresh_agent_session_per_task: true
  multi_task_bundles: false
  one_feature_branch_per_task: true
  source_required_for_branch_name: true
  serialize_task_integration: true
  finish_current_task_after_deadline: true
  start_new_tasks_after_deadline: false
  stop_when_workload_exhausted: true
  stop_when_no_unpaused_ready_tasks: false
  keep_alive_when_pending_tasks_are_temporarily_unrunnable: true
  retry_recovery_until_soft_deadline: true
  branch_collision_excludes_only_colliding_task: true
  error_before_deadline_completes_session: false
  continue_after_terminal_non_done_task: true
  terminal_outcomes_immutable_within_active_session: true
  terminal_task_reenable_authority: new-direct-human-instruction-in-new-or-restarted-session
  autopilot_continuation_is_human_authorization: false
  dependency_selection: graph-snapshot
  waiting_dependency_is_transient: true
  dependency_skip_evaluation: batched-terminal-transitive-closure
  precompute_transitive_dependency_skips: true
  batch_dependency_skip_metadata_commit: true
  single_metadata_commit_per_skip_closure: true
  next_task_after_terminal_non_done: earliest-ready-task
  require_green_develop_before_next_task: true

ci:
  workflow_file: .github/workflows/ci.yml
  integration_branch: develop
  merge_commit_required: true
  wait_for_exact_feature_sha: true
  wait_for_exact_merge_sha: true
  required_check: Required gate
  platforms:
    - ubuntu-latest
    - windows-latest
  poll_interval_seconds: 30
  observation_timeout_minutes: 120
  only_success_conclusion_is_green: true
  classification:
    modes:
      - duplicate
      - metadata
      - full
    duplicate_requires_prior_successful_exact_sha: true
    duplicate_waits_only_for_older_run_ids: true
    duplicate_wait_timeout_seconds: 900
    metadata_requires_green_exact_base_sha: true
    metadata_allowlist:
      - 'docs/autonomous-development/task/(?!0000-)[0-9]{4}-[^/]+\.md'
      - 'docs/autonomous-development/reports/[0-9]{4}-[0-9]{2}-[0-9]{2}-[^/]+\.md'
    metadata_must_not_feed_application_inventories: true
    manual_dispatch_default: full
    manual_full_bypasses_duplicate_reuse: true
    unknown_or_ambiguous_fallback: full
    stable_required_gate_for_every_mode: true
  on_success:
    finalize_done: true
    delete_feature_branch_local: true
    delete_feature_branch_remote_if_present: true
  on_pre_merge_block:
    feature_ci_non_success_marks_blocked: false
    feature_ci_repair:
      enabled: true
      max_attempts: 3
      same_task_branch: true
      fresh_synchronous_worker_per_attempt: true
      actionable_repository_failure_only: true
      keep_done_as_ci_pending_during_repair: true
      block_after_exhaustion_or_unverifiable: true
    mark_task_blocked: true
    wait_for_blocked_metadata_ci_green: true
    preserve_feature_branch_local: true
    preserve_feature_branch_remote: true
    freeze_preserved_feature_branch: true
  on_failure:
    stop_current_integration: true
    revert_merge_commit: true
    wait_for_revert_ci_green: true
    verify_revert_tree_matches_pre_merge_base: true
    stop_session_if_revert_not_green: false
    enter_session_recovery_pending_if_revert_not_green: true
    classify_non_green_revert_as: baseline-or-upstream-incident
    mark_task_reverted: true
    wait_for_reverted_metadata_ci_green: true
    preserve_feature_branch_local: true
    preserve_feature_branch_remote: true
    freeze_preserved_feature_branch: true
  on_dependency_skip:
    create_feature_branch: false
    invoke_worker: false
    mark_task_skipped_dependency: true
    record_direct_and_transitive_causes: true
    materialize_entire_terminal_closure: true
    aggregate_in_one_metadata_commit: true
    wait_for_metadata_ci_green: true

decisions:
  sys_020_notebook: remain-blocked
  ui_018: remain-blocked
  ng_001: resume-and-complete-existing-work
  ng_005: resume-and-complete-existing-work
  ng_023: resume-and-complete-existing-work
  ng_028: remain-blocked
  task_batching: disabled
  autonomous_execution_scope: complete-series
  fe_019_completed:
    task: "0041"
    source: FE-019
    outcome: DONE
    merged_develop_sha: b25210a7e0fba04d98c58bb45ec62fc2526ee3ff
    select_again: false

telemetry:
  record_ci_classification_counts: true
  record_platform_jobs_started_and_avoided: true
  record_ci_wait_seconds: true
  record_task_wall_seconds: true
  record_worker_invocations: true
  record_pushes_and_retries: true
  record_workload_allowlist_counts: true
  unavailable_metrics_must_be_reported_as_unavailable: true

on_finish:
  validate_repository: true
  require_green_develop: true
  generate_report: true
  stop_managed_runtime_processes: true
  report_directory: docs/autonomous-development/reports
  report_template: docs/autonomous-development/reports/0000-session-report-template.md
  commit_and_push_report_to_develop: true
  wait_for_exact_report_commit_ci: true
  session_fatal_blocker_completes_coordinator_objective: false
  task_complete_before_deadline_on_error: false
  emit_final_summary_and_report_path_before_task_complete: true
  task_complete_is_final_autopilot_action: true
  call_task_complete: true
