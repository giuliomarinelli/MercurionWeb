version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 8
    reviewers: [giuliomarinelli]
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      development-tooling:
        dependency-type: development
        patterns: ["@types/*", "eslint*", "jest*", "karma*", "prettier"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /MercurionData
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Rome
    open-pull-requests-limit: 4
    reviewers: [giuliomarinelli]
    labels: [dependencies]
    commit-message:
      prefix: deps-data

  - package-ecosystem: npm
    directory: /MercurionLandingFactory
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Rome
    open-pull-requests-limit: 4
    reviewers: [giuliomarinelli]
    labels: [dependencies]
    commit-message:
      prefix: deps-landing

  - package-ecosystem: docker
    directory: /MercurionWebNg
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Rome
    open-pull-requests-limit: 2
    reviewers: [giuliomarinelli]
    labels: [dependencies, containers]
    commit-message:
      prefix: deps-docker

  - package-ecosystem: docker
    directory: /MercurionWebNode
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 2
    reviewers: [giuliomarinelli]
    labels: [dependencies, containers]
    commit-message:
      prefix: deps-docker

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Rome
    open-pull-requests-limit: 4
    reviewers: [giuliomarinelli]
    labels: [dependencies, ci]
    commit-message:
      prefix: deps-actions
