name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record toolchain
        run: |
          node --version
          npm --version

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint Angular
        run: npm run ci:lint:angular

      - name: Lint Nest
        run: npm run ci:lint:nest

      - name: Typecheck Angular
        run: npm run ci:typecheck:angular

      - name: Typecheck Nest
        run: npm run ci:typecheck:nest

      - name: Test Angular
        run: npm run ci:test:angular

      - name: Test Nest
        run: npm run ci:test:nest

      - name: Test Nest E2E
        run: npm run ci:test:nest:e2e

      - name: Build Angular
        run: npm run ci:build:angular

      - name: Build Nest
        run: npm run ci:build:nest

  required:
    name: Required gate
    if: ${{ always() }}
    needs:
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = "success"
