name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Validation path for an explicit baseline certification
        required: true
        default: full
        type: choice
        options:
          - full
          - auto

# PR revisions may supersede one another. A develop run is never cancelled:
# its exact merge SHA must retain an observable result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') }}

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: 22.16.0
  NPM_VERSION: 10.9.2

jobs:
  plan:
    name: Classify validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      reason: ${{ steps.classify.outputs.reason }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      change_count: ${{ steps.classify.outputs.change_count }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Classify exact SHA
        id: classify
        env:
          CI_DUPLICATE_WAIT_SECONDS: 900
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/classify-ci.mjs

  metadata:
    name: Autonomous metadata
    if: ${{ needs.plan.outputs.mode == 'metadata' }}
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate autonomous control plane
        run: npm ci

      - name: Run autonomous validators
        run: npm run ci:validate:autonomous

      - name: Check metadata diff
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"

  # Disposable services belong only to the job that consumes them; the
  # unit/static gates must not depend on shared or production infrastructure.
  quality:
    name: Prerequisites (${{ matrix.os }})
    if: ${{ needs.plan.outputs.mode == 'full' }}
    needs:
      - plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record exact SHA and toolchain
        run: |
          git rev-parse HEAD
          node --version
          npm --version

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate autonomous control plane
        run: npm run ci:validate:autonomous

      - name: Enforce code-duplication baseline
        run: npm run ci:duplication

      - name: Upload code-duplication report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: duplication-report-${{ matrix.os }}
          if-no-files-found: ignore
          path: reports/duplication

      - name: Run lint gates
        run: npm run ci:lint

      - name: Run typecheck gates
        run: npm run ci:typecheck

      - name: Run GraphQL and generated-contract gates
        run: npm run ci:graphql

      - name: Run registered static and architecture gates
        run: npm run ci:static

      - name: Upload topology diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: topology-report-${{ matrix.os }}
          if-no-files-found: ignore
          path: reports/topology

  angular-unit:
    name: Angular unit tests
    if: ${{ needs.plan.outputs.mode == 'full' }}
    needs:
      - plan
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run complete Angular unit suite
        run: npm run ci:test:angular

      - name: Upload Angular test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: angular-test-diagnostics
          if-no-files-found: ignore
          path: |
            MercurionWebNg/coverage
            MercurionWebNg/test-results
            MercurionWebNg/**/*.xml

  nest-unit:
    name: Nest unit tests
    if: ${{ needs.plan.outputs.mode == 'full' }}
    needs:
      - plan
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run complete Nest unit suite
        run: npm run ci:test:nest

      - name: Upload Nest test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nest-test-diagnostics
          if-no-files-found: ignore
          path: |
            MercurionWebNode/coverage
            MercurionWebNode/test-results
            MercurionWebNode/**/*.xml

  nest-e2e:
    name: Nest E2E tests
    if: ${{ needs.plan.outputs.mode == 'full' }}
    needs:
      - plan
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run isolated Nest E2E suite
        run: npm run ci:test:nest:e2e

      - name: Upload Nest E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nest-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            MercurionWebNode/coverage
            MercurionWebNode/test-results
            MercurionWebNode/**/*.xml

  database-schema:
    name: PostgreSQL migration schema
    if: ${{ needs.plan.outputs.mode == 'full' }}
    needs:
      - plan
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: migration-ci
          POSTGRES_DB: mercurion_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d mercurion_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQL_DATABASE_TYPE: postgres
      SQL_DATABASE_HOST: 127.0.0.1
      SQL_DATABASE_PORT: 5432
      SQL_DATABASE_USERNAME: app
      SQL_DATABASE_PASSWORD: migration-ci
      SQL_DATABASE: mercurion_integration
      SQL_DATABASE_LOGGING: "false"
      SQL_DATABASE_LOGGER: advanced-console
      MERCURION_POSTGRES_INTEGRATION: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Apply migrations and reject entity drift
        run: npm run ci:database-schema

      - name: Run real PostgreSQL transaction integration suite
        run: npm run ci:test:nest:integration

      - name: Upload PostgreSQL integration diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-diagnostics
          if-no-files-found: ignore
          path: MercurionWebNode/test-results/integration-results.json

  build:
    name: Build artifacts
    if: ${{ needs.plan.outputs.mode == 'full' }}
    needs:
      - plan
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build Angular
        run: npm run ci:build:angular

      - name: Build Nest
        run: npm run ci:build:nest

      - name: Upload build and bundle diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          if-no-files-found: ignore
          path: |
            MercurionWebNg/dist
            MercurionWebNode/dist
            MercurionWebNg/**/*.stats.json
            MercurionWebNg/dist/**/bundle-gate-report.json
            MercurionWebNg/**/*.json

  browser-e2e:
    name: Critical browser journeys
    if: ${{ needs.plan.outputs.mode == 'full' }}
    needs:
      - plan
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install the disposable nginx edge
        run: sudo apt-get update && sudo apt-get install --yes nginx

      - name: Start Angular and the canonical browser edge
        shell: bash
        run: |
          npm run start:dev --workspace mercurion_web_ng > angular-e2e.log 2>&1 &
          echo $! > angular-e2e.pid
          nginx -c "$GITHUB_WORKSPACE/playwright/nginx.ci.conf" -p "$GITHUB_WORKSPACE"
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://localhost:8888/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat angular-e2e.log
          exit 1

      - name: Run critical browser journeys
        run: npm run test:e2e:critical

      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: critical-browser-diagnostics
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results/playwright
            angular-e2e.log

      - name: Stop browser runtime
        if: ${{ always() }}
        shell: bash
        run: |
          if test -f /tmp/mercurion-playwright-nginx.pid; then
            nginx -s stop -c "$GITHUB_WORKSPACE/playwright/nginx.ci.conf" -p "$GITHUB_WORKSPACE" || true
          fi
          if test -f angular-e2e.pid; then
            kill "$(cat angular-e2e.pid)" || true
          fi

  containers:
    name: Container ${{ matrix.name }}
    if: ${{ needs.plan.outputs.mode == 'full' }}
    needs:
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: angular-production
            dockerfile: MercurionWebNg/Dockerfile
            target: production
          - name: angular-staging
            dockerfile: MercurionWebNg/Dockerfile
            target: staging
          - name: angular-test
            dockerfile: MercurionWebNg/Dockerfile
            target: test
          - name: nest-production
            dockerfile: MercurionWebNode/Dockerfile
            target: production
          - name: nest-staging
            dockerfile: MercurionWebNode/Dockerfile
            target: staging
          - name: nest-test
            dockerfile: MercurionWebNode/Dockerfile
            target: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate container build contract and lockfile drift
        run: npm run ci:containers

      - name: Build container without cache
        run: docker build --pull --no-cache --file "${{ matrix.dockerfile }}" --target "${{ matrix.target }}" --tag "mercurion-ci-${{ matrix.name }}" .

      - name: Inspect standalone runtime contract
        run: node scripts/check-container-runtime.mjs --dockerfile "${{ matrix.dockerfile }}" --image "mercurion-ci-${{ matrix.name }}"

      - name: Smoke-test standalone runtime contract
        run: node scripts/smoke-container-runtime.mjs --image "mercurion-ci-${{ matrix.name }}"

      - name: Verify Nest production image inventory, SBOM and vulnerability scan
        if: ${{ matrix.name == 'nest-production' }}
        run: node scripts/check-production-container.mjs --image "mercurion-ci-${{ matrix.name }}" --report-dir "reports/containers/${{ matrix.name }}"

      - name: Upload container inventory and supply-chain diagnostics
        if: ${{ always() && matrix.name == 'nest-production' }}
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.name }}-supply-chain
          if-no-files-found: error
          path: reports/containers/${{ matrix.name }}

      - name: Confirm clean build did not modify tracked files
        run: git diff --exit-code

  required:
    name: Required gate
    if: ${{ always() }}
    needs:
      - plan
      - metadata
      - quality
      - angular-unit
      - nest-unit
      - nest-e2e
      - database-schema
      - build
      - browser-e2e
      - containers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected validation path
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          PREREQUISITES_RESULT: ${{ needs.quality.result }}
          ANGULAR_UNIT_RESULT: ${{ needs.angular-unit.result }}
          NEST_UNIT_RESULT: ${{ needs.nest-unit.result }}
          NEST_E2E_RESULT: ${{ needs.nest-e2e.result }}
          DATABASE_SCHEMA_RESULT: ${{ needs.database-schema.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN_RESULT: ${{ needs.plan.result }}
        shell: bash
        run: |
          test "$PLAN_RESULT" = "success"
          case "$MODE" in
            duplicate)
              ;;
            metadata)
              test "$METADATA_RESULT" = "success"
              ;;
            full)
              test "$PREREQUISITES_RESULT" = "success"
              test "$ANGULAR_UNIT_RESULT" = "success"
              test "$NEST_UNIT_RESULT" = "success"
              test "$NEST_E2E_RESULT" = "success"
              test "$DATABASE_SCHEMA_RESULT" = "success"
              test "$BUILD_RESULT" = "success"
              test "$BROWSER_E2E_RESULT" = "success"
              test "$CONTAINERS_RESULT" = "success"
              ;;
            *)
              echo "Unknown CI mode: $MODE" >&2
              exit 1
              ;;
          esac
