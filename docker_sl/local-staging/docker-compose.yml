services:
  nginx_sl_test:
    image: nginx:1.27-alpine
    container_name: nginx_sl_test
    ports:
      - "8880:80"
    volumes:
      - ../nginx_test/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../MercurionLandingFactory/dist/MercurionLandingFactory/browser:/usr/share/nginx/html/mercurion-errors:ro
    networks:
      - spectralume_network
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]


  mercurion_web_node:
    container_name: mercurion_web_node
    build:
      context: ../..
      dockerfile: MercurionWebNode/Dockerfile.test
    image: mercurion_web_node:latest
    environment:
      # qui l’URL che i test usano per colpire l’API
      API_BASE_URL: http://mercurion_nginx:8880
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - 8098
    networks:
      - spectralume_network
    restart: unless-stopped

  mercurion_web_ng:
    build:
      context: ../..
      dockerfile: MercurionWebNg/Dockerfile.test
    container_name: mercurion_web_ng
    user: "10101:10101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - 3497       
    networks:
      - spectralume_network
    restart: unless-stopped

volumes:
  redis_data:
    external: true
    name: docker_sl_redis_data
  pg_data:
    external: true
    name: docker_sl_pg_data
  meili_data:
    external: true
    name: docker_sl_meili_data


networks:
  spectralume_network:
    driver: bridge
    name: spectralume_network
