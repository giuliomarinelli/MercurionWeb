# nginx.prod.conf

events {}

http {
    # niente version info in header
    server_tokens off;

    # Cloudflare is the only external proxy trusted to establish the client IP.
    # Keep this list synchronized with https://www.cloudflare.com/ips/.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # limite globale per upload (modifica se servono file > 100MB)
    client_max_body_size 100M;

    # supporto WebSocket (upgrade header)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ---------------------------------------------------------------------------
    # HTTP -> HTTPS redirect (Cloudflare parlerà comunque in HTTPS verso questo)
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name mercurion.org www.mercurion.org;

        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------------------
    # HTTPS origin (dietro Cloudflare in modalità Full strict)
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name mercurion.org www.mercurion.org;

        # Certificato ORIGIN (es. Cloudflare Origin Certificate)
        ssl_certificate /etc/nginx/ssl/mercurion_org.pem;
        ssl_certificate_key /etc/nginx/ssl/mercurion_org.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Ciphers moderni (puoi adattarli alle linee guida più recenti)
        ssl_ciphers
        'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:'
        'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:'
        'ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

        # ------------------------------
        # Security headers "globali"
        # ------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), bluetooth=(), fullscreen=(self)" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # (facoltativo) compressione base
        gzip on;
        gzip_types text/plain text/css application/javascript application/json application/xml+rss image/svg+xml;
        gzip_min_length 512;

        # -------------------------------------------------------------------------
        # WebSocket NestJS (/socket.io)
        # -------------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://host.docker.internal:8099/socket.io/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------------------
        # API NestJS (/api)
        # -------------------------------------------------------------------------
        location ^~ /api/ {
            proxy_pass http://host.docker.internal:8099/api/;

            # riscrive solo il Path dei cookie emessi dal backend
            proxy_cookie_path /api/ /;
            proxy_cookie_path /api /;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------------------
        # Angular SPA su /app (MVP pubblico)
        # -------------------------------------------------------------------------
        # /app → /app/
        location = /app {
            rewrite ^ /app/ break;
        }

        location ^~ /app/ {
            proxy_pass http://host.docker.internal:3498;

            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_redirect off;

            # header aggiuntivi per la SPA (sovrascrivono eventuali duplicati)
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # -------------------------------------------------------------------------
        # Root → redirect verso /app/ (MVP)
        # -------------------------------------------------------------------------
        location = / {
            # per adesso 302 (flessibile); quando sei sicuro puoi valutare 301
            return 302 /app/;
        }

        # opzionale: fallback 404 esplicito
        location / {
            return 404;
        }
    }
}
