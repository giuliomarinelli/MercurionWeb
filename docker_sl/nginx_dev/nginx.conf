events {

}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  client_max_body_size 100M;

  server {
    listen 80;
    server_name _;

    # ============================
    # PUBLIC STATIC ASSETS (ERROR PAGES)
    # ============================

    location = /og/mercurion-og.png {
      proxy_pass http://host.docker.internal:8099/og/mercurion-og.png;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 15s;
    }
    
    location = /robots.txt {
      proxy_pass http://host.docker.internal:8099/robots.txt;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 15s;
    }

    location = /sitemap.xml {
      proxy_pass http://host.docker.internal:8099/sitemap.xml;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 15s;
    }

    # opzionale: se vuoi /health al root (tu ora escludi /health dal globalPrefix)
    location = /health {
      proxy_pass http://host.docker.internal:8099/health;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 15s;
    }

    location = /favicon.ico {
      alias /usr/share/nginx/html/mercurion-errors/favicon.ico;
      access_log off;
      expires 7d;
    }

    location ~* ^/(main-[A-Z0-9]+\.js|styles-[A-Z0-9]+\.css)$ {
      alias /usr/share/nginx/html/mercurion-errors/$1;
      access_log off;
      expires 7d;
    }

    location ^~ /fonts/ {
      alias /usr/share/nginx/html/mercurion-errors/fonts/;
      access_log off;
      expires 30d;
      try_files $uri =404;
    }

    location ^~ /logo/ {
      alias /usr/share/nginx/html/mercurion-errors/logo/;
      access_log off;
      expires 30d;
      try_files $uri =404;
    }

    # ============================
    # INTERNAL ERROR PAGES
    # ============================

    error_page
    400 401 402 403 404 405 406 407 408 409 410
    411 412 413 414 415 416 417 418 421 422 423
    424 425 426 428 429 431 451
    500 501 502 503 504 505 506 507 508 510 511 599
    /errors/$status/;

    location ^~ /errors/ {
      alias /usr/share/nginx/html/mercurion-errors/;
      try_files $uri $uri/ =500;
      internal;
    }

    # ============================
    # WebSocket NestJS
    # ============================

    location /socket.io/ {
      proxy_pass http://host.docker.internal:8099;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 60s;
      proxy_buffering off;
    }

    # ============================
    # API NestJS
    # ============================

    location ^~ /api/ {
      proxy_pass http://host.docker.internal:8099/api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_connect_timeout 60s;
      proxy_cookie_path /api/ /;
      proxy_cookie_path /api /;
    }

    # ============================
    # Angular SPA
    # ============================

    location = /m {
      rewrite ^ /m/ break;
    }

    location ^~ /m/ketcher/ {
      proxy_pass http://host.docker.internal:3498;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Content-Security-Policy "frame-ancestors 'self';" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
    }

    location ^~ /m/ {
      proxy_pass http://host.docker.internal:3498;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
    }

    location = / {
      return 302 $scheme://$http_host/m/;
    }
  }
}
