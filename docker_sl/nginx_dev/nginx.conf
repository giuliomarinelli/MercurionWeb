events {

}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  client_max_body_size 100M;

  server {
    listen 80;
    server_name _;

    # ============================
    # PUBLIC STATIC ASSETS (ERROR PAGES)
    # ============================

    location = /og/mercurion-og.png {
      proxy_pass http://host.docker.internal:8099/og/mercurion-og.png;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 15s;
    }
    
    location = /robots.txt {
      proxy_pass http://host.docker.internal:8099/robots.txt;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 15s;
    }

    location = /sitemap.xml {
      proxy_pass http://host.docker.internal:8099/sitemap.xml;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 15s;
    }

    # opzionale: se vuoi /health al root (tu ora escludi /health dal globalPrefix)
    location = /health {
      proxy_pass http://host.docker.internal:8099/health;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 15s;
    }

    location = /favicon.ico {
      alias /usr/share/nginx/html/mercurion-errors/favicon/favicon-light-theme.ico;
      access_log off;
      expires 7d;
    }

    # Gli asset della SPA ora vivono alla root (main/styles/fonts/favicon/logo).
    # Le pagine di errore usano quindi un namespace separato, così i due build
    # non possono intercettarsi a vicenda.
    location ^~ /_edge-errors/ {
      alias /usr/share/nginx/html/mercurion-errors/;
      access_log off;
      expires 7d;

      sub_filter_once off;
      sub_filter_types text/css application/manifest+json application/json;
      sub_filter 'url(/fonts/' 'url(/_edge-errors/fonts/';
      sub_filter 'url(../fonts/' 'url(/_edge-errors/fonts/';
      sub_filter 'url(/logo/' 'url(/_edge-errors/logo/';
      sub_filter 'url(../logo/' 'url(/_edge-errors/logo/';
      sub_filter '"/favicon/' '"/_edge-errors/favicon/';
      sub_filter '"/logo/' '"/_edge-errors/logo/';
      sub_filter 'href="../favicon/' 'href="/_edge-errors/favicon/';
      sub_filter 'src="../favicon/' 'src="/_edge-errors/favicon/';
      sub_filter 'href="../logo/' 'href="/_edge-errors/logo/';
      sub_filter 'src="../logo/' 'src="/_edge-errors/logo/';
    }

    # Namespace riservato: finché non vengono configurati endpoint well-known
    # espliciti, non deve mai cadere nel fallback HTML della SPA.
    location = /.well-known {
      return 404;
    }

    location ^~ /.well-known/ {
      return 404;
    }

    # ============================
    # INTERNAL ERROR PAGES
    # ============================

    error_page
    400 401 402 403 404 405 406 407 408 409 410
    411 412 413 414 415 416 417 418 421 422 423
    424 425 426 428 429 431 451
    500 501 502 503 504 505 506 507 508 510 511 599
    /errors/$status/;

    location ^~ /errors/ {
      alias /usr/share/nginx/html/mercurion-errors/;
      try_files $uri $uri/ /_edge-error-fallback.html;
      internal;

      # Rende assoluti e isolati gli asset del documento servito tramite
      # error_page, indipendentemente dall'URL originale che ha fallito.
      sub_filter_once off;
      sub_filter '<base href="../">' '<base href="/_edge-errors/">';
      sub_filter 'url(/fonts/' 'url(/_edge-errors/fonts/';
      sub_filter 'url(../fonts/' 'url(/_edge-errors/fonts/';
      sub_filter 'url(/logo/' 'url(/_edge-errors/logo/';
      sub_filter 'url(../logo/' 'url(/_edge-errors/logo/';
      sub_filter 'href="../favicon/' 'href="/_edge-errors/favicon/';
      sub_filter 'src="../favicon/' 'src="/_edge-errors/favicon/';
      sub_filter 'href="../logo/' 'href="/_edge-errors/logo/';
      sub_filter 'src="../logo/' 'src="/_edge-errors/logo/';
    }

    # Mantiene lo status originale se la landing di errore non è disponibile.
    location = /_edge-error-fallback.html {
      alias /usr/share/nginx/html/50x.html;
      internal;
    }

    # ============================
    # WebSocket NestJS
    # ============================

    location = /socket.io {
      return 308 /socket.io/$is_args$args;
    }

    location ^~ /socket.io/ {
      proxy_pass http://host.docker.internal:8099;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 60s;
      proxy_buffering off;
    }

    # ============================
    # API NestJS
    # ============================

    location = /api {
      return 308 /api/$is_args$args;
    }

    location ^~ /api/ {
      proxy_pass http://host.docker.internal:8099/api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_connect_timeout 60s;
      proxy_cookie_path /api/ /;
      proxy_cookie_path /api /;
    }

    # ============================
    # Angular SPA
    # ============================

    location = /ketcher {
      return 308 /ketcher/$is_args$args;
    }

    location ^~ /ketcher/ {
      proxy_pass http://host.docker.internal:3498;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Content-Security-Policy "frame-ancestors 'self';" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
    }

    # Compatibilità di rollout per client che hanno memorizzato il vecchio
    # redirect permanente "/ -> /m/": nessun redirect HTTP verso la root.
    # Il prefisso viene tolto solo verso l'upstream; il bootstrap della SPA
    # normalizza poi la barra del browser con history.replaceState.
    location = /m/ketcher {
      return 308 /m/ketcher/$is_args$args;
    }

    location ^~ /m/ketcher/ {
      proxy_pass http://host.docker.internal:3498/ketcher/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Content-Security-Policy "frame-ancestors 'self';" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
    }

    location = /m {
      proxy_pass http://host.docker.internal:3498/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
    }

    location ^~ /m/ {
      proxy_pass http://host.docker.internal:3498/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
    }

    # Tutto ciò che non appartiene ai namespace riservati sopra è una route
    # o una risorsa statica della SPA.
    location / {
      proxy_pass http://host.docker.internal:3498;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
    }
  }
}
