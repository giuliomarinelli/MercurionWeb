events {}

http {
  
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # WebSocket NestJS
    location /socket.io/ {
      proxy_pass http://host.docker.internal:8099/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API NestJS
    location ^~ /api {
      proxy_pass http://host.docker.internal:8099;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /app {
      rewrite ^ /app/ break;   
    }

    # Angular SPA dev (ng serve con Vite) montata su /app
    location ^~ /app/ {
      proxy_set_header Host $http_host;
      proxy_pass       http://host.docker.internal:3498;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect   off;
    }

    # Angular SSR pubblico su /
    location / {
      proxy_pass http://host.docker.internal:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

}
