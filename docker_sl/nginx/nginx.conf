events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # --- WebSocket NestJS ----------------------------------------------------
    location /socket.io/ {
      proxy_pass http://host.docker.internal:8099/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- API NestJS ---------------------------------------------------------
    # 1. la location termina con “/api/”  →  funziona anche per /api, /api/auth...
    # 2. proxy_pass con *lo stesso* prefisso  →  il backend riceve ancora /api/…
    # 3. proxy_cookie_path riscrive *solo* l’attributo Path del cookie
    location ^~ /api/ {
      proxy_pass        http://host.docker.internal:8099/api/;

      # qualunque "Path=/api" oppure "Path=/api/" diventa "Path=/"
      proxy_cookie_path /api/ /;
      proxy_cookie_path /api  /;

      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Angular SPA dev su /app -------------------------------------------
    location = /app          { rewrite ^ /app/ break; }
    location ^~ /app/ {
      proxy_pass        http://host.docker.internal:3498;
      proxy_http_version 1.1;
      proxy_set_header   Host $http_host;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_redirect     off;
    }

    # --- Angular SSR pubblico su / -----------------------------------------
    location / {
      proxy_pass        http://host.docker.internal:4000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
