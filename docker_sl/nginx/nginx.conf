events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  client_max_body_size 100M;

  server {
    listen 80;
    # per ENV locale / origin senza TLS (poi sotto vediamo 443)

    # --- WebSocket NestJS ----------------------------------------------------
    location /socket.io/ {
      proxy_pass http://host.docker.internal:8099/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API NestJS ---------------------------------------------------------
    location ^~ /api/ {
      proxy_pass http://host.docker.internal:8099/api/;

      proxy_cookie_path /api/ /;
      proxy_cookie_path /api /;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Angular SPA su /app -----------------------------------------------
    location = /app {
      rewrite ^ /app/ break;
    }
    
    location ^~ /app/ {
      proxy_pass http://host.docker.internal:3498;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;

      # header di sicurezza per la SPA
      add_header X-Frame-Options DENY;
      add_header X-Content-Type-Options nosniff;
      add_header Referrer-Policy no-referrer;
    }

    # --- Redirect root → /app/ ---------------------------------------------
    location = / {
      return 302 $scheme://$http_host/app/;
    }

  }
}
