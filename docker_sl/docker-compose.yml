
# Configurazione Docker Compose per ambiente di sviluppo

services:

  redis_sl:
    image: redis:latest
    container_name: redis_sl
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: >
      redis-server
      --notify-keyspace-events Ex
      --save "900 1"
      --save "300 10"
      --save "60 10000"
      --dbfilename dump.rdb
      --dir /data
    networks:
      - spectralume_network


  nats_sl:
    image: nats:latest
    container_name: nats_sl
    ports:
      - "4223:4222"
      - "6223:6222"
      - "8223:8222"
    restart: unless-stopped
    networks:
      - spectralume_network

  pg_sl:
    image: postgres:16
    container_name: pg_sl
    shm_size: "4gb"              # <— aumenta /dev/shm
    command: >
      postgres
      -c shared_buffers=4GB
      -c work_mem=128MB
      -c maintenance_work_mem=4GB
      -c max_parallel_maintenance_workers=2
    environment:
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: postgres
      POSTGRES_USER: app
    ports: ["5431:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d drugcentral"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - spectralume_network

  # pgvector-init_sl:
  #   image: postgres:16
  #   depends_on:
  #     pg_sl:
  #       condition: service_healthy
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: mercurion
  #   command: >
  #     bash -lc '
  #       psql "host=pg user=$$POSTGRES_USER password=$$POSTGRES_PASSWORD dbname=$$POSTGRES_DB"
  #       -v ON_ERROR_STOP=1
  #       -c "CREATE EXTENSION IF NOT EXISTS vector;"
  #     '
  #   restart: "no"

  meilisearch_sl:
    image: getmeili/meilisearch:latest
    container_name: meilisearch_sl
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: root 
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped
    networks:
      - spectralume_network

  nginx_sl:
    image: nginx:latest
    container_name: nginx_sl
    ports:
    - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
    - spectralume_network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  meili_data:
    driver: local
  pg_data:
    driver: local

networks:
  spectralume_network:
    driver: bridge
    name: spectralume_network
