services:
  mercurion_web_ng_beta:
    build:
      context: ../../..
      dockerfile: MercurionWebNg/Dockerfile
      target: staging
      args:
        BUILD_VERSION: ${BUILD_VERSION}
        BUILD_REVISION: ${BUILD_REVISION}
    image: ${REGISTRY_IMAGE_NG}:${BUILD_VERSION}-${BUILD_REVISION}
    user: "10101:10101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mercurion_web_node_beta:
    build:
      context: ../../..
      dockerfile: MercurionWebNode/Dockerfile
      target: staging
      args:
        BUILD_VERSION: ${BUILD_VERSION}
        BUILD_REVISION: ${BUILD_REVISION}
    image: ${REGISTRY_IMAGE_NODE}:${BUILD_VERSION}-${BUILD_REVISION}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mercurion_tox_21_beta:
    image: ${REGISTRY_IMAGE_MT21:?Set the Tox21 image repository}:${TOX21_VERSION:?Set the Tox21 version}-${TOX21_REVISION:?Set the full Tox21 source SHA}
    environment:
      PY_ENV: staging
      VERSION: ${TOX21_VERSION}
      NATS_URL: ${TOX21_NATS_URL:?Set the broker reachable from this container}
    user: "10021:10021"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

  nginx_sl_beta:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        APP_VERSION: ${APP_VERSION}
    image: ${REGISTRY_IMAGE_NGINX}:${NGINX_TAG}


  pg_sl_beta:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: postgres16-pgvector:${PGV_TAG}
    container_name: pg_sl_beta


