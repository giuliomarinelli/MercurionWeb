services:
  mercurion_web_ng_prod:
    build:
      context: ../../..
      dockerfile: MercurionWebNg/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
    image: ${REGISTRY_IMAGE_NG}:${APP_VERSION}

  mercurion_web_node_prod:
    build:
      context: ../../..
      dockerfile: MercurionWebNode/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
    image: ${REGISTRY_IMAGE_NODE}:${APP_VERSION}
