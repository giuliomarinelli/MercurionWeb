map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_sec_fetch_dest $ketcher_allowed {
  default 1; # di default permetto
  document 0; # blocco le navigazioni top-level esplicite
}


client_max_body_size 100M;

server {
  listen 80 default_server;
  server_name _;

  # tutte le pagine di errore HTTP custom
  error_page
  400 401 402 403 404 405 406 407 408 409 410
  411 412 413 414 415 416 417 418 421 422 423
  424 425 426 428 429 431 451
  500 501 502 503 504 505 506 507 508 510 511 599
  /errors/$status/;

  location ^~ /errors/ {
    alias /usr/share/nginx/html/mercurion-errors/;
    try_files $uri $uri/ =500;
    internal;
  }

  # WebSocket NestJS
  location /socket.io/ {

    proxy_pass http://mercurion_web_node:8098/socket.io/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket-friendly timeouts
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;

    # niente buffering su WS
    proxy_buffering off;
  }

  # API NestJS
  location ^~ /api/ {
    proxy_pass http://mercurion_web_node:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 60s;

    proxy_cookie_path /api/ /;
    proxy_cookie_path /api /;
  }

  # /m → aggiungo lo slash finale, MA tenendo la porta originale
  location = /m {
    return 302 $scheme://$http_host/m/;
  }

  location = /m/ketcher/index.html {
    # se NON è richiesta per un iframe → 403
    if ($ketcher_allowed = 0) {
      return 403;
    }

    proxy_pass http://mercurion_web_ng:3497/ketcher/index.html;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self';" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  location ^~ /m/ketcher/ {
    proxy_pass http://mercurion_web_ng:3497;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self';" always;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  # Angular SPA
  location ^~ /m/ {
    proxy_pass http://mercurion_web_ng:3497;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
  }

  # root → redirect a /m/ (sempre con la porta del client)
  location = / {
    return 302 $scheme://$http_host/m/;
  }
}
