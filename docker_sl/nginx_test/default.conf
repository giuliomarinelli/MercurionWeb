map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

client_max_body_size 100M;

server {
  listen 80 default_server;
  server_name _;

  # WebSocket NestJS
  location /socket.io/ {
    proxy_pass http://mercurion_web_node:8098/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # API NestJS
  location ^~ /api/ {
    proxy_pass http://mercurion_web_node:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cookie_path /api/ /;
    proxy_cookie_path /api /;
  }

  # /m → aggiungo lo slash finale, MA tenendo la porta originale
  location = /m {
    return 302 $scheme://$http_host/m/;
  }

  # Angular SPA
  location ^~ /m/ {
    proxy_pass http://mercurion_web_ng:3497;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
  }

  # root → redirect a /m/ (sempre con la porta del client)
  location = / {
    return 302 $scheme://$http_host/m/;
  }
}
