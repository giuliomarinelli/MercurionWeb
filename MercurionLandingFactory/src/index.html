<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <title>Mercurion</title>
  <base href="/" />

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Primary Meta -->
  <meta name="application-name" content="Mercurion" />
  <meta name="apple-mobile-web-app-title" content="Mercurion" />
  <meta name="author" content="Mercurion" />
  <meta name="generator" content="Angular 20" />

  <meta name="description"
    content="Mercurion è una piattaforma web di nuova generazione per la chimica computazionale: esplorazione molecolare, collezioni personalizzate, predizione tossicologica basata su intelligenza artificiale e integrazione con database scientifici come ChEMBL." />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow" />

  <!-- Canonical -->
  <link rel="canonical" href="https://www.mercurion.org" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Mercurion – Next Generation Chemistry Platform" />
  <meta property="og:description"
    content="Piattaforma web per chimica computazionale, analisi molecolare e predizione tossicologica AI-driven. Mercurion connette dati scientifici e intelligenza artificiale in un unico ambiente." />
  <meta property="og:site_name" content="Mercurion" />
  <meta property="og:locale" content="it_IT" />
  <meta property="og:url" content="https://www.mercurion.org" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Mercurion – Next Generation Chemistry Platform" />
  <meta name="twitter:description"
    content="Chimica computazionale, collezioni molecolari e predizione tossicologica basata su AI. Mercurion è il tuo laboratorio digitale." />

  <!-- Theme / UI -->
  <meta name="theme-color" content="#0b0f14" />
  <meta name="color-scheme" content="dark light" />

  <!-- Primary favicon: SVG theme-aware (uses prefers-color-scheme inside the SVG) -->
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <!-- PNG fallback -->
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96-light-theme.png" />
  <!-- ICO legacy fallback -->
  <link rel="icon" href="/favicon/favicon-light-theme.ico" sizes="32x32" />
  <!-- Apple Touch Icon (iOS Home Screen) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <!-- Manifest PWA (192x192, 512x512) -->
  <link rel="manifest" href="/favicon/site.webmanifest" />
</head>

<body>
  <div id="root"></div>
  <script>
    document.querySelectorAll('.landing-btn').forEach((node) => node.addEventListener('click', (e) => {
      switch (e.currentTarget.id) {
        case 'go-back-btn':
          history.back()
          break
        case 'go-home-btn':
          location.href = '/'
      }
    }))
  </script>
</body>

</html>
