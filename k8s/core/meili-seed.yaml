apiVersion: v1
kind: Pod
metadata:
  name: meili-seed
  namespace: mercurion-core
spec:
  restartPolicy: Never
  containers:
    - name: seed
      image: ubuntu:24.04
      command: ["bash", "-lc", "sleep infinity"]
      resources:
        requests:
          cpu: "100m"
          memory: "1Gi"
          ephemeral-storage: "1Gi"
        limits:
          cpu: "500m"
          memory: "3Gi"
          ephemeral-storage: "2Gi"
      volumeMounts:
        - name: meili-data
          mountPath: /meili_data
        - name: meili-staging
          mountPath: /staging
  volumes:
    - name: meili-data
      persistentVolumeClaim:
        claimName: meili-data
    - name: meili-staging
      persistentVolumeClaim:
        claimName: meili-staging
