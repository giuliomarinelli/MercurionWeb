apiVersion: batch/v1
kind: Job
metadata:
  name: meili-restore-from-gcs-v2
  namespace: mercurion-core
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "[restore] scarico tar da GCS..."
              gcloud storage cp \
                gs://mercurion-volume-bucket/meilisearch/docker_sl_meili_data.tar.gz \
                /tmp/meili-data.tar.gz

              echo "[restore] pulizia /meili_data..."
              rm -rf /meili_data/* /meili_data/.[!.]* /meili_data/..?* || true

              echo "[restore] estrazione tar..."
              tar xzf /tmp/meili-data.tar.gz -C /meili_data

              echo "[restore] lista /meili_data:"
              ls -lh /meili_data | head

              echo "[restore] dimensione totale PVC:"
              du -sh /meili_data
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
      volumes:
        - name: meili-data
          persistentVolumeClaim:
            claimName: meili-data
