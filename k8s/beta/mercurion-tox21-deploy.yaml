apiVersion: apps/v1
kind: Deployment
metadata:
  name: mercurion-tox-21
  namespace: mercurion-beta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mercurion-tox-21
  template:
    metadata:
      labels:
        app: mercurion-tox-21
    spec:
      containers:
        - name: tox21
          image: europe-west8-docker.pkg.dev/mercurion-483615/mercurion/mercurion-tox-21:1.2026.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PY_ENV
              value: "staging"
            - name: VERSION
              value: "1.2026.2"
            - name: NATS_URL
              value: "nats://nats-sl.mercurion-beta.svc.cluster.local:4222"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "700m"
              memory: "2Gi"


