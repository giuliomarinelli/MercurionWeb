---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mercurion-pg-backups
  namespace: mercurion-beta
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 60Gi   # spazio per ~4 backup di un DB da ~30Gi (dump ~15Gi l'uno)

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mercurion-pg-backup
  namespace: mercurion-beta
spec:
  # 03:00 UTC ogni 2 giorni
  schedule: "0 3 */2 * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: europe-west8-docker.pkg.dev/mercurion-481213/mercurion/mercurion-tox-21:1.2026.0
              envFrom:
                - secretRef:
                    name: mercurion-pg-credentials
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mercurion-pg-credentials
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TS=$(date +%Y%m%d-%H%M%S)
                  FILE="/backups/mercurion-${TS}.dump"

                  echo ">>> Dumping to $FILE"
                  pg_dump -Fc -h mercurion-pg -U "$POSTGRES_USER" "$POSTGRES_DB" > "$FILE"

                  echo ">>> Removing backups older than 7 days..."
                  find /backups -type f -mtime +7 -name 'mercurion-*.dump' -delete

                  echo ">>> Backup done."
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mercurion-pg-backups
