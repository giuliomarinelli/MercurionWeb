apiVersion: apps/v1
kind: Deployment
metadata:
  name: mercurion-web-node
  namespace: mercurion-beta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mercurion-web-node
  template:
    metadata:
      labels:
        app: mercurion-web-node
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: web-node
          image: ${REGISTRY_IMAGE_NODE}:${BUILD_VERSION}-${BUILD_REVISION}
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8098

          # 1) tutte le env (segrete e non) arrivano dai Secret
          envFrom:
            - secretRef:
                name: mercurion-web-node-env   # creato da .env.mercurion-web-node.beta
            - secretRef:
                name: mercurion-jwt-b64        # contenente le 4 chiavi RSA *_B64

          # 2) override/minime env specifiche di runtime
          env:
            - name: APP_ENV
              value: "staging"
            - name: NODE_ENV
              value: "production"
            - name: APP_PORT
              value: "8098"
            - name: APP_HOST
              value: "0.0.0.0"
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          startupProbe:
            tcpSocket:
              port: 8098
            failureThreshold: 60
            periodSeconds: 2

          livenessProbe:
            tcpSocket:
              port: 8098
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            tcpSocket:
              port: 8098
            periodSeconds: 5
            failureThreshold: 3

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory


---
apiVersion: v1
kind: Service
metadata:
  name: mercurion-web-node
  namespace: mercurion-beta
spec:
  type: ClusterIP
  selector:
    app: mercurion-web-node
  ports:
    - port: 8098
      targetPort: 8098
