apiVersion: v1
kind: ConfigMap
metadata:
  name: mercurion-nginx-edge-config
  namespace: mercurion-beta
data:
  default.conf: |
    map_hash_bucket_size 256;

    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }

    map $http_sec_fetch_dest $ketcher_allowed {
      default 1;
      document 0;
    }

    # ============================
    # MAINTENANCE MODE + BYPASS
    # ============================

    # 1 = maintenance ON, 0 = OFF
    map $host $maintenance_mode {
      default 1;
      # quando vorrai spegnerla per un host:
      # mercurion.app 0;
      # beta.mercurion.app 0;
    }

    # Header segreto per bypass (es. da Cloudflare / estensioni)
    map $http_x_mercurion_bypass $maintenance_bypass_header {
      default 0;
      ***REMOVED*** 1;   
    }

    # bypass via cookie (settato dal Worker)
    map $cookie_mercurion_bypass $maintenance_bypass_cookie {
      default 0;
      "1" 1;
    }

    # unisci header + cookie
    map "$maintenance_bypass_header$maintenance_bypass_cookie" $maintenance_bypass_effective {
      default 0;
      "10" 1;  # solo header
      "01" 1;  # solo cookie
      "11" 1;  # entrambi
    }

    # se maintenance_mode=1 e niente bypass => blocca
    map $maintenance_mode$maintenance_bypass_effective $maintenance_block {
      default 0;
      "10" 1;
    }

    client_max_body_size 100M;

    # ============================
    # HTTP -> HTTPS redirect
    # ============================
    server {
      listen 80 default_server;
      server_name _;

      return 301 https://$host$request_uri;
    }

    # ============================
    # SERVER HTTPS EDGE
    # ============================
    server {
      listen 443 ssl http2;
      server_name _;

      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;

      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_prefer_server_ciphers on;

      # ============================
      # GATE "IN COSTRUZIONE"
      # ============================
      if ($maintenance_block) {
        return 503;
      }

      # ============================
      # SECURITY HEADERS
      # ============================
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;

      # ============================
      # PUBLIC STATIC ASSETS (ERROR PAGES)
      # ============================
      location ~* ^/(main-[A-Z0-9]+\.js|styles-[A-Z0-9]+\.css)$ {
        root /usr/share/nginx/html/mercurion-errors;
        access_log off;
        expires 7d;
      }

      location ^~ /fonts/ {
        root /usr/share/nginx/html/mercurion-errors;
        access_log off;
        expires 30d;
        try_files $uri =404;
      }

      # favicon "directory"
      location ^~ /favicon/ {
        root /usr/share/nginx/html/mercurion-errors;
        access_log off;
        expires 30d;
        try_files $uri =404;
      }

      # favicon classica /favicon.ico -> cartella favicon della landing
      location = /favicon.ico {
        alias /usr/share/nginx/html/mercurion-errors/favicon/favicon.ico;
        access_log off;
        expires 30d;
      }

      location ^~ /logo/ {
        root /usr/share/nginx/html/mercurion-errors;
        access_log off;
        expires 30d;
        try_files $uri =404;
      }

      # ============================
      # INTERNAL ERROR PAGES
      # ============================
      error_page
        400 401 402 403 404 405 406 407 408 409 410
        411 412 413 414 415 416 417 418 421 422 423
        424 425 426 428 429 431 451
        500 501 502 503 504 505 506 507 508 510 511 599
        /errors/$status/;

      location ^~ /errors/ {
        alias /usr/share/nginx/html/mercurion-errors/;
        try_files $uri $uri/ =500;
        internal;
      }

      # ============================
      # WebSocket NestJS
      # ============================
      location /socket.io/ {
        proxy_pass http://mercurion-web-node:8098/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
      }

      # ============================
      # API NestJS
      # ============================
      location ^~ /api/ {
        proxy_pass http://mercurion-web-node:8098;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 60s;

        proxy_cookie_path /api/ /;
        proxy_cookie_path /api /;
      }

      # ============================
      # Angular SPA (Ketcher + main)
      # ============================
      location ^~ /m/ketcher/ {
        if ($ketcher_allowed = 0) {
          return 403;
        }
        proxy_pass http://mercurion-web-ng:3497;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
      }

      location = /m {
        return 302 $scheme://$http_host/m/;
      }

      location ^~ /m/ {
        proxy_pass http://mercurion-web-ng:3497;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
      }

      location = / {
        return 302 $scheme://$http_host/m/;
      }
    }
