apiVersion: batch/v1
kind: Job
metadata:
  name: meili-restore-job
  namespace: mercurion-core
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: restore
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
        command:
        - /bin/sh
        - -c
        - |
          set -eu

          echo "[restore] pulizia dir di destinazione..."
          rm -rf /meili_data/* /meili_data/.[!.]* /meili_data/..?* || true

          echo "[restore] inizio streaming da GCS..."
          if gcloud storage cat gs://mercurion-volume-bucket/meilisearch/docker_sl_meili_data.tar.gz | tar xz -C /meili_data ; then
            echo "[restore] completato."
          else
            echo "[restore] ERRORE durante il restore" >&2
            exit 1
          fi
        volumeMounts:
        - name: meili-data
          mountPath: /meili_data
      volumes:
      - name: meili-data
        persistentVolumeClaim:
          claimName: meili-data
  backoffLimit: 0
