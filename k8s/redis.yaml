apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379

    notify-keyspace-events "Exg"

    save 900 1
    save 300 10
    save 60 10000

    dbfilename dump.rdb
    dir /data

    maxmemory 256mb
    maxmemory-policy volatile-ttl

    appendonly no
    protected-mode yes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard-rwo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-sl
  template:
    metadata:
      labels:
        app: redis-sl
    spec:
      containers:
        - name: redis
          image: redis:8.2.2-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: redis-config
              mountPath: /usr/local/etc/redis
            - name: redis-data
              mountPath: /data
          command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
            items:
              - key: redis.conf
                path: redis.conf
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sl
spec:
  type: ClusterIP
  selector:
    app: redis-sl
  ports:
    - port: 6379
      targetPort: 6379
