    <<: *fixture
    command: [-B, /fixture/topology_fixture.py, serve, --identity, nginx-edge]
    x-mercurion-canonical-service: nginx
    networks: [edge, stg-web, prod-web]
    expose: ['80']
  meilisearch:
    <<: *fixture
    command: [-B, /fixture/topology_fixture.py, serve, --identity, meilisearch]
    x-mercurion-canonical-service: meilisearch
    networks: [stg-search, prod-search]
    expose: ['7700']
    volumes: [../fixtures/topology_fixture.py:/fixture/topology_fixture.py:ro, meili-data:/fixture-data]
  meilisearch-ui:
    <<: *fixture
    command: [-B, /fixture/topology_fixture.py, serve, --identity, meilisearch-ui]
    profiles: [admin-fixture]
    networks: [admin-ui]
    expose: ['24900']

networks:
