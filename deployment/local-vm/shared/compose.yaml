  entrypoint: [python]
  dns_opt: [ndots:1]
  volumes: [../fixtures/topology_fixture.py:/fixture/topology_fixture.py:ro]
  profiles: [topology-fixture]
  pull_policy: never
  user: '65534:65534'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 64m
  cpus: 0.25
