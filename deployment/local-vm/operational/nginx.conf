worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Avoid query strings and authentication state in edge access logs.
  log_format concise '$remote_addr $request_method $uri $status';
  access_log /dev/stdout concise;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server { listen 80 default_server; server_name _; return 404; }
  server {
    listen 80;
    server_name preview.mercurion.app;
    set $backend http://web-node-preview:8098;
    set $frontend http://web-ng-preview:3497;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = /health { proxy_pass $backend; }
    location = /robots.txt { proxy_pass $backend; }
    location = /sitemap.xml { proxy_pass $backend; }
    location ^~ /og/ { proxy_pass $backend; }
    location = /api { return 308 /api/; }
    location ^~ /api/ { proxy_pass $backend; }
    location = /socket.io { return 308 /socket.io/; }
    location ^~ /socket.io/ {
      proxy_pass $backend;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 600s;
      proxy_buffering off;
    }
    location / { proxy_pass $frontend; }
  }
}
