<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Ketcher is a web-based chemical structure editor" />
  <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <title>Ketcher v3.18.0</title>
  <script defer="defer" src="./static/js/main.e47c48ad.js"></script>
  <link href="./static/css/main.96b87be0.css" rel="stylesheet" />
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Mercurion mobile keyboard compatibility guard -->
  <script>
    (function () {
      const isMobile = matchMedia('(pointer: coarse)').matches;
      if (!isMobile) return;

      const SEL = 'textarea[class*="cliparea"], textarea[class*="cliparea-module"], textarea[class*="clipArea"]';

      function neuter(el) {
        if (!(el instanceof HTMLTextAreaElement)) return;

        // disinnesca la tastiera
        el.setAttribute('readonly', 'true');
        el.setAttribute('inputmode', 'none');
        el.setAttribute('tabindex', '-1');
        el.setAttribute('aria-hidden', 'true');
        el.style.caretColor = 'transparent';

        // kill-switch: se la lib chiama el.focus(), non succede niente
        try { el.focus = function () { }; } catch { }
        el.blur();
      }

      function patchAll() {
        document.querySelectorAll(SEL).forEach(neuter);
      }

      // patch immediata + patch se viene ricreata
      patchAll();
      new MutationObserver(patchAll).observe(document.documentElement, { childList: true, subtree: true });

      // se comunque entra focus, lo buttiamo fuori
      document.addEventListener('focusin', (e) => {
        const t = e.target;
        if (t instanceof HTMLTextAreaElement && /cliparea/i.test(t.className)) {
          e.stopImmediatePropagation();
          t.blur();
        }
      }, true);

      // EXTRA: blocca focus programmatico solo per cliparea (senza rompere altri input eventuali)
      const orig = HTMLElement.prototype.focus;
      HTMLElement.prototype.focus = function (...args) {
        if (this instanceof HTMLTextAreaElement && /cliparea/i.test(this.className)) return;
        return orig.apply(this, args);
      };
    })();
  </script>

  <!-- Mercurion Ketcher iframe bridge -->
  <script>
    if (matchMedia('(pointer: coarse)').matches) {
      document.body.removeAttribute('contenteditable');
      document.documentElement.removeAttribute('contenteditable');
    }

    if (window.top === window.self) {
      window.location.href = '/';
    }

    let revision = 0;
    let sessionId;
    let subscription;
    let operationQueue = Promise.resolve();
    let exporting;
    let committedSnapshot;
    let convertedSnapshot;
    const CONVERSION_TIMEOUT_MS = 2000;
    const COMMAND_TIMEOUT_MS = 2500;

    function within(promise, milliseconds, expired = () => {}) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          expired();
          reject(new Error('Ketcher operation timed out'));
        }, milliseconds);
        Promise.resolve(promise).then(value => {
          clearTimeout(timer);
          resolve(value);
        }, error => {
          clearTimeout(timer);
          reject(error);
        });
      });
    }

    function serializeConversions() {
      const service = window.ketcher.structService;
      const convert = service.convert.bind(service);
      let tail = Promise.resolve();
      // The bundled standalone service uses EE.once(Convert) before checking
      // inputData. Concurrent conversions consume each other's reply listeners.
      // Guard the shared service, including conversions started by Ketcher UI.
      service.convert = (...args) => {
        const result = tail.then(() => within(convert(...args), CONVERSION_TIMEOUT_MS));
        tail = result.then(() => {}, () => {});
        return result;
      };
    }

    function hasPreview() {
      const structure = window.ketcher.editor.struct();
      return Array.from(structure.atoms.values()).some(atom => atom.isPreview) ||
        Array.from(structure.bonds.values()).some(bond => bond.isPreview);
    }

    function captureCommittedSnapshot() {
      // getKet serializes synchronously without invoking the Indigo worker.
      // Capture before the tool adds another preview; convert only when read.
      let ket;
      try { ket = Promise.resolve(window.ketcher.getKet()); }
      catch (error) { ket = Promise.reject(error); }
      committedSnapshot = { revision, ket };
      void ket.catch(() => {});
      return committedSnapshot;
    }

    function convertSnapshot(ket) {
      if (convertedSnapshot?.ket === ket) return convertedSnapshot.result;
      const entry = { ket };
      entry.result = window.ketcher.structService.convert({
        struct: ket, output_format: 'chemical/x-daylight-smiles'
      }, window.ketcher.editor.serverSettings).then(result => {
        if (typeof result.struct !== 'string') throw new Error('Invalid Ketcher export');
        return result.struct;
      });
      convertedSnapshot = entry;
      void entry.result.catch(() => {
        if (convertedSnapshot === entry) convertedSnapshot = undefined;
      });
      return entry.result;
    }

    function notifyChange() {
      if (hasPreview()) return;
      revision++;
      captureCommittedSnapshot();
      if (sessionId) window.parent.postMessage({ type: 'structureChanged', sessionId, revision }, location.origin);
    }

    async function exportCurrent() {
      if (exporting) return exporting;
      const attempt = { expired: false };
      const operation = (async () => {
        // The live vendor model also contains the template under the cursor,
        // including connected previews that temporarily modify existing bonds.
        // Never publish it or remove it from the interactive canvas to export.
        let snapshot = hasPreview() ? committedSnapshot : captureCommittedSnapshot();
        for (;;) {
          const startedAt = revision;
          if (!snapshot) throw new Error('Committed Ketcher structure unavailable');
          try {
            const ket = await snapshot.ket;
            if (attempt.expired) throw new Error('Export expired');
            const smiles = await convertSnapshot(ket);
            if (attempt.expired) throw new Error('Export expired');
            if (startedAt === revision) return { smiles, revision: startedAt };
          } catch (error) {
            if (attempt.expired || startedAt === revision) throw error;
          }
          // A change during export must not be overwritten by its completion.
          snapshot = committedSnapshot;
        }
      })();
      const pending = within(operation, COMMAND_TIMEOUT_MS, () => { attempt.expired = true; });
      exporting = pending;
      try { return await pending; }
      finally { if (exporting === pending) exporting = undefined; }
    }

    function waitForKetcher() {
      if (!window.ketcher?.editor) {
        setTimeout(waitForKetcher, 100);
        return;
      }
      serializeConversions();
      subscription = window.ketcher.editor.subscribe('change', notifyChange);
      window.parent.postMessage({ type: 'ketcherReady' }, location.origin);
    }
    waitForKetcher();

    window.addEventListener('beforeunload', () => {
      if (subscription) window.ketcher?.editor.unsubscribe('change', subscription);
    }, { once: true });

    window.addEventListener('message', event => {
      if (event.source !== window.parent || event.origin !== location.origin) return;
      const message = event.data;
      if (!message || !['setMolecule', 'getSmiles'].includes(message.type) ||
          typeof message.sessionId !== 'string' || !Number.isInteger(message.requestId)) return;
      if (sessionId && sessionId !== message.sessionId) return;
      sessionId = message.sessionId;
      const reply = (type, payload) => window.parent.postMessage({
        type, payload, sessionId: message.sessionId, requestId: message.requestId, revision
      }, location.origin);
      operationQueue = operationQueue.then(async () => {
        try {
          if (!window.ketcher) throw new Error('Ketcher unavailable');
          if (message.type === 'setMolecule') {
            const previousRevision = revision;
            await within(window.ketcher.setMolecule(message.payload), COMMAND_TIMEOUT_MS);
            if (revision === previousRevision) notifyChange();
            reply('moleculeSet');
          } else {
            // Reconcile against the vendor only outside a transient preview.
            const current = await exportCurrent();
            reply('smiles', current.smiles);
          }
        } catch {
          reply(message.type === 'setMolecule' ? 'moleculeSetError' : 'smilesError');
        }
      });
    });
  </script>
</body>

</html>
