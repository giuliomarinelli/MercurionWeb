server {
  listen 3497;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gli asset mancanti devono restituire 404, non l'HTML della SPA.
  location ~* \.(?:css|gif|html|ico|jpe?g|js|json|map|mjs|png|svg|txt|wasm|webmanifest|woff2?)$ {
    try_files $uri =404;
  }

  location = /ketcher {
    try_files /ketcher/index.html =404;
  }

  location = /ketcher/ {
    try_files /ketcher/index.html =404;
  }

  # Fallback SPA nella document root. Non testare $uri: /welcome è anche una directory di asset.
  location / {
    try_files /index.html =404;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
