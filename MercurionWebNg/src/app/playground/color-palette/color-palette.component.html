<div class="p-8 space-y-8 transition-all duration-300">

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div
      class="p-4 rounded shadow text-center bg-light-surface-secondary dark:bg-dark-surface-secondary border-light-border dark:border-dark-border border">
      Surface Secondary
    </div>

    <div class="p-4 rounded shadow text-center bg-light-accent-primary dark:bg-dark-accent-primary text-white">
      Accent Primary
    </div>

    <div class="p-4 rounded shadow text-center bg-light-accent-secondary dark:bg-dark-accent-secondary text-white">
      Accent Secondary
    </div>

    <div class="p-4 rounded shadow text-center bg-light-warning dark:bg-dark-warning text-white">
      Warning
    </div>

    <div class="p-4 rounded shadow text-center bg-light-error dark:bg-dark-error text-white">
      Error
    </div>

    <div class="p-4 rounded shadow text-center border-2 border-light-border dark:border-dark-border">
      Border Example
    </div>

    <div class="p-4 rounded shadow text-center text-light-on-surface-secondary dark:text-dark-on-surface-secondary">
      Text Secondary
    </div>

    <div class="p-4 rounded shadow text-center text-light-on-surface-main dark:text-dark-on-surface-main">
      Text Primary
    </div>
  </div>
  <!-- Griglia di Bottoni di esempio -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <!-- Button Primary -->
    <button class="btn btn-light-accent-primary">Primary</button>

    <!-- Button Outline Primary -->
    <button class="btn btn-outline-light-accent-primary">Outline Primary</button>

    <!-- Button Dark -->
    <button class="btn btn-dark">Dark</button>

    <!-- Button Outline Dark -->
    <button class="btn btn-outline-dark">Outline Dark</button>

    <!-- Disabled Button -->
    <button class="btn btn-light-accent-primary btn-disabled" disabled>Disabled</button>

    <!-- Small Button -->
    <button class="btn btn-light-accent-primary btn-sm">Small</button>

    <!-- Large Button -->
    <button class="btn btn-light-accent-primary btn-lg">Large</button>

    <!-- Outline Slate-200 -->
    <button class="btn btn-outline-slate-200">Slate Outline</button>

    <!-- Pill Shape Button -->
    <button class="btn btn-light-accent-primary btn-pill">Pill Button</button>

    <!-- Combo: Pill + Outline -->
    <button class="btn btn-outline-light-accent-primary btn-pill">Outline Pill</button>
  </div>
</div>
