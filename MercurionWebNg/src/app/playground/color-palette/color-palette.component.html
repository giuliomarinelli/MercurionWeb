<div class="p-8 space-y-8 transition-all duration-300">

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div
      class="p-4 rounded shadow text-center bg-light-surface-secondary dark:bg-dark-surface-secondary border-light-border dark:border-dark-border border">
      Surface Secondary
    </div>

    <div class="p-4 rounded shadow text-center bg-light-accent-primary dark:bg-dark-accent-primary text-white">
      Accent Primary
    </div>

    <div class="p-4 rounded shadow text-center bg-light-accent-secondary dark:bg-dark-accent-secondary text-white">
      Accent Secondary
    </div>

    <div class="p-4 rounded shadow text-center bg-light-warning dark:bg-dark-warning text-white">
      Warning
    </div>

    <div class="p-4 rounded shadow text-center bg-light-error dark:bg-dark-error text-white">
      Error
    </div>

    <div class="p-4 rounded shadow text-center border-2 border-light-border dark:border-dark-border">
      Border Example
    </div>

    <div class="p-4 rounded shadow text-center text-light-on-surface-secondary dark:text-dark-on-surface-secondary">
      Text Secondary
    </div>

    <div class="p-4 rounded shadow text-center text-light-on-surface-main dark:text-dark-on-surface-main">
      Text Primary
    </div>
  </div>
  <!-- Griglia di Bottoni di esempio -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <!-- Button Primary -->
    <button class="btn btn-light-accent-primary btn-light-accent-primary-hover">
      Primary
    </button>

    <!-- Button Outline Primary -->
    <button class="btn btn-outline-light-accent-primary btn-outline-light-accent-primary-hover">
      Outline Primary
    </button>

    <!-- Button Dark -->
    <button class="btn btn-dark btn-dark-hover">
      Dark
    </button>

    <!-- Button Outline Dark -->
    <button class="btn btn-outline-dark btn-outline-dark-hover">
      Outline Dark
    </button>

    <!-- Button Light -->
    <button class="btn btn-light btn-light-hover">
      Dark
    </button>

    <!-- Button Outline Light -->
    <button class="btn btn-outline-light btn-outline-light-hover">
      Outline Dark
    </button>

    <!-- Disabled Button (niente hover) -->
    <button class="btn btn-accent-primary btn-disabled" disabled>
      Disabled
    </button>

    <!-- Small Buttons -->
    <button class="btn btn-accent-primary btn-accent-primary-hover btn-sm">
      Small
    </button>
    <button class="btn btn-accent-secondary btn-accent-secondary-hover btn-sm">
      Small
    </button>

    <!-- Large Buttons -->
    <button class="btn btn-accent-primary btn-accent-primary-hover btn-lg">
      Large
    </button>
    <button class="btn btn-accent-secondary btn-accent-secondary-hover btn-lg">
      Large
    </button>

    <!-- Outline Slate-200 -->
    <button class="btn btn-outline-slate-200 btn-outline-slate-200-hover">
      Slate Outline
    </button>

    <!-- Pill Shape Button -->
    <button class="btn btn-accent-primary btn-accent-primary-hover btn-pill">
      Pill Button
    </button>

    <!-- Combo: Pill + Outline -->
    <button class="btn btn-outline-accent-primary btn-outline-accent-primary-hover btn-pill">
      Outline Pill
    </button>
  </div>

</div>
