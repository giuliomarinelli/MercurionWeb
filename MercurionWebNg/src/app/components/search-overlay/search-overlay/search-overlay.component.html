<div class="fixed inset-0 z-[999] bg-black/70 backdrop-blur-sm text-white transition-all">
  <div class="flex justify-center items-start pt-32 sm:pt-40 px-4">
    <div class="w-full max-w-3xl space-y-6">
      <!-- HEADER -->
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-semibold tracking-wide">Ricerca molecolare</h2>
        <button (click)="close()" class="text-white/70 hover:text-white transition">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
            <path fill="currentColor"
              d="M310.6 361.4L233.3 284.1 310.6 206.7c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L188 238.7 110.6 161.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L142.7 284.1 65.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L188 329.3l77.3 77.3c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3z" />
          </svg>
        </button>
      </div>

      <!-- Qui inserirai i tuoi componenti -->
      <!-- Esempio placeholder -->
      <app-search-input (search)="onSearch($event)" />

      <div class="bg-white/10 p-6 rounded-xl text-sm text-white/90">
        <p>[🔬] Area input, filtri e risultati</p>
      </div>
    </div>
  </div>
</div>
