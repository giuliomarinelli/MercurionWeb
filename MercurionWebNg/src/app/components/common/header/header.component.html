<header
  class="px-5 py-4 bg-light-surface-secondary dark:bg-neutral-900 dark:border-b-[0.5px] dark:border-slate-300 shadow-md dark:shadow-none">
  <div class="max-w-[1540px] mx-auto flex justify-between items-center transition-colors duration-300 ease-out">
    <div class="flex items-center gap-6">
      @if (designService.maxBk("md")()) {
      <button (click)="toggleOffCanvasMenu()">
        <svg xmlns="http://www.w3.org/2000/svg"
          class="h-[22px] w-[22px] min-[350px]:h-6 min-[350px]:w-6 fill-current text-light-on-surface-secondary dark:text-slate-100 off-canvas-menu-button"
          viewBox="0 0 448 512"><!--!Font Awesome Pro 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2025 Fonticons, Inc.-->
          <path
            d="M0 88C0 74.7 10.7 64 24 64l400 0c13.3 0 24 10.7 24 24s-10.7 24-24 24L24 112C10.7 112 0 101.3 0 88zM0 248c0-13.3 10.7-24 24-24l272 0c13.3 0 24 10.7 24 24s-10.7 24-24 24L24 272c-13.3 0-24-10.7-24-24zM192 408c0 13.3-10.7 24-24 24L24 432c-13.3 0-24-10.7-24-24s10.7-24 24-24l144 0c13.3 0 24 10.7 24 24z" />
        </svg>
      </button>
      }
      @if (designService.minBk("sm")()) {
      <img [ngSrc]="titleSrc()" alt="Mercurion" width="927" height="234" priority="true" class="w-[145px] h-auto">
      }
      @if (designService.minBk("lg")()) {
      <app-nav [header]="true"></app-nav>
      }
    </div>
    @if (designService.maxBk("xs")()) {
    <img [ngSrc]="titleSrc()" alt="Mercurion" width="927" height="234" priority="true"
      class="w-[128px] min-[350px]:w-[145px] h-auto">
    }
    <div class="theme-menu-container flex gap-2">
      <button class="flex items-center theme-toggle-button xl:ml-8 mr-0 xs:mr-1 lg:mr-2" (click)="toggleThemeMenu()">
        @if (themeManager.theme() === 'dark') {
        <svg xmlns="http://www.w3.org/2000/svg"
          class="h-[22px] w-[22px] min-[350px]:h-7 min-[350px]:w-7 fill-current text-slate-100 hover:text-slate-300 transition-colors duration-300"
          viewBox="0 0 384 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
          <path
            d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z" />
        </svg>
        } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
          viewBox="0 0 512 512"><!--!Font Awesome Pro 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2025 Fonticons, Inc.-->
          <path class="fill-current text-light-accent-secondary" d="M208 256a48 48 0 1 0 96 0 48 48 0 1 0 -96 0z" />
          <path class="fill-current text-light-on-surface-secondary"
            d="M232 88l0 24 48 0 0-24 0-64 0-24L232 0l0 24 0 64zm24 120a48 48 0 1 1 0 96 48 48 0 1 1 0-96zm0 144a96 96 0 1 0 0-192 96 96 0 1 0 0 192zM0 232l0 48 24 0 64 0 24 0 0-48-24 0-64 0L0 232zm424 0l-24 0 0 48 24 0 64 0 24 0 0-48-24 0-64 0zM232 512l48 0 0-24 0-64 0-24-48 0 0 24 0 64 0 24zM92 58L58 92l17 17 45.3 45.3 17 17 33.9-33.9-17-17L108.9 75 92 58zM391.8 357.8l-17-17-33.9 33.9 17 17L403.1 437l17 17L454 420l-17-17-45.3-45.3zM58 420L92 454l17-17 45.3-45.3 17-17-33.9-33.9-17 17L75 403.1 58 420zM357.8 120.2l-17 17 33.9 33.9 17-17L437 108.9l17-17L420 58l-17 17-45.3 45.3z" />
        </svg>
        }
      </button>
      @if (designService.minBk('md')()) {
      <div
        class="rounded-full bg-light-accent-secondary text-slate-100 dark:bg-dark-accent-primary p-2 text-sm font-semibold">
        GM
      </div>
      }
      @if (designService.minBk('lg')()) {
      <button class="flex gap-4 items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6"
          viewBox="0 0 128 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
          <path class="fill-current text-light-on-surface-main/85 dark:text-slate-100"
            d="M64 360a56 56 0 1 0 0 112 56 56 0 1 0 0-112zm0-160a56 56 0 1 0 0 112 56 56 0 1 0 0-112zM120 96A56 56 0 1 0 8 96a56 56 0 1 0 112 0z" />
        </svg>
      </button>
      }
    </div>
  </div>
</header>
<!-- Menu cambio tema -->
<div
  class="theme-menu-container absolute right-4 mt-2 z-50 w-72 text-md rounded-md shadow-lg bg-white text-light-on-surface-main dark:text-slate-100 dark:bg-neutral-800 transform transition-all duration-300 ease-out"
  [ngClass]="{
    'opacity-100 translate-x-0 translate-y-0': themeMenuOpen(),
    'opacity-0 pointer-events-none translate-x-2 -translate-y-2': !themeMenuOpen()
  }">
  <div class="py-2">
    <button (click)="onThemeChange('light'); closeThemeMenu()"
      class="group flex items-center w-full px-4 py-4 gap-4 dark:hover:bg-slate-300/30 hover:bg-slate-200/40 transition-colors duration-300"
      [ngClass]="{'bg-slate-200 dark:bg-slate-500': themeManager.chosenTheme() === 'light'}">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
        viewBox="0 0 512 512"><!--!Font Awesome Pro 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2025 Fonticons, Inc.-->
        <path class="fill-current text-light-accent-secondary dark:text-dark-accent-secondary"
          d="M208 256a48 48 0 1 0 96 0 48 48 0 1 0 -96 0z" />
        <path class="fill-current text-light-on-surface-secondary dark:text-slate-300"
          d="M232 88l0 24 48 0 0-24 0-64 0-24L232 0l0 24 0 64zm24 120a48 48 0 1 1 0 96 48 48 0 1 1 0-96zm0 144a96 96 0 1 0 0-192 96 96 0 1 0 0 192zM0 232l0 48 24 0 64 0 24 0 0-48-24 0-64 0L0 232zm424 0l-24 0 0 48 24 0 64 0 24 0 0-48-24 0-64 0zM232 512l48 0 0-24 0-64 0-24-48 0 0 24 0 64 0 24zM92 58L58 92l17 17 45.3 45.3 17 17 33.9-33.9-17-17L108.9 75 92 58zM391.8 357.8l-17-17-33.9 33.9 17 17L403.1 437l17 17L454 420l-17-17-45.3-45.3zM58 420L92 454l17-17 45.3-45.3 17-17-33.9-33.9-17 17L75 403.1 58 420zM357.8 120.2l-17 17 33.9 33.9 17-17L437 108.9l17-17L420 58l-17 17-45.3 45.3z" />
      </svg>
      <span>Modalità chiara</span>
      @if(themeManager.chosenTheme() === 'light') {
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 relative left-2"
        viewBox="0 0 512 512"><!--!Font Awesome Pro 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2025 Fonticons, Inc.-->
        <path class="fill-current text-light-accent-secondary dark:text-dark-accent-secondary"
          d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zm126.1 0L160 222.1c.3 .3 .6 .6 1 1c5.3 5.3 10.7 10.7 16 16c15.7 15.7 31.4 31.4 47 47c37-37 74-74 111-111c5.3-5.3 10.7-10.7 16-16c.3-.3 .6-.6 1-1L385.9 192c-.3 .3-.6 .6-1 1l-16 16L241 337l-17 17-17-17-64-64c-5.3-5.3-10.7-10.7-16-16l-1-1z" />
        <path class="fill-current text-slate-50"
          d="M385 193L241 337l-17 17-17-17-80-80L161 223l63 63L351 159 385 193z" />
      </svg>
      }
    </button>
    <button (click)="onThemeChange('dark'); closeThemeMenu()"
      class="group flex items-center w-full px-4 py-4 gap-4 dark:hover:bg-slate-300/30 hover:bg-slate-200/40 transition-colors duration-300"
      [ngClass]="{'bg-slate-200 dark:bg-slate-500': themeManager.chosenTheme() === 'dark'}">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 fill-current text-slate-400 dark:text-slate-100"
        viewBox="0 0 384 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
        <path
          d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z" />
      </svg>
      <span>Modalità scura</span>
      @if(themeManager.chosenTheme() === 'dark') {
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 relative left-2"
        viewBox="0 0 512 512"><!--!Font Awesome Pro 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2025 Fonticons, Inc.-->
        <path class="fill-current text-light-accent-secondary dark:text-dark-accent-secondary"
          d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zm126.1 0L160 222.1c.3 .3 .6 .6 1 1c5.3 5.3 10.7 10.7 16 16c15.7 15.7 31.4 31.4 47 47c37-37 74-74 111-111c5.3-5.3 10.7-10.7 16-16c.3-.3 .6-.6 1-1L385.9 192c-.3 .3-.6 .6-1 1l-16 16L241 337l-17 17-17-17-64-64c-5.3-5.3-10.7-10.7-16-16l-1-1z" />
        <path class="fill-current text-slate-50"
          d="M385 193L241 337l-17 17-17-17-80-80L161 223l63 63L351 159 385 193z" />
      </svg>
      }
    </button>
    <button (click)="onThemeChange('OS'); closeThemeMenu()"
      class="group flex items-center w-full px-4 py-4 gap-4 dark:hover:bg-slate-300/30 hover:bg-slate-200/40 transition-colors duration-300"
      [ngClass]="{'bg-slate-200 dark:bg-slate-500': themeManager.chosenTheme() === 'OS'}">
      @if (themeManager.isSystemDark) {
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 fill-current text-slate-400 dark:text-slate-100"
        viewBox="0 0 384 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
        <path
          d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z" />
      </svg>
      } @else if (themeManager.isSystemLight) {
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
        viewBox="0 0 512 512"><!--!Font Awesome Pro 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2025 Fonticons, Inc.-->
        <path class="fill-current text-light-accent-secondary dark:text-dark-accent-secondary"
          d="M208 256a48 48 0 1 0 96 0 48 48 0 1 0 -96 0z" />
        <path class="fill-current text-light-on-surface-secondary dark:text-slate-100"
          d="M232 88l0 24 48 0 0-24 0-64 0-24L232 0l0 24 0 64zm24 120a48 48 0 1 1 0 96 48 48 0 1 1 0-96zm0 144a96 96 0 1 0 0-192 96 96 0 1 0 0 192zM0 232l0 48 24 0 64 0 24 0 0-48-24 0-64 0L0 232zm424 0l-24 0 0 48 24 0 64 0 24 0 0-48-24 0-64 0zM232 512l48 0 0-24 0-64 0-24-48 0 0 24 0 64 0 24zM92 58L58 92l17 17 45.3 45.3 17 17 33.9-33.9-17-17L108.9 75 92 58zM391.8 357.8l-17-17-33.9 33.9 17 17L403.1 437l17 17L454 420l-17-17-45.3-45.3zM58 420L92 454l17-17 45.3-45.3 17-17-33.9-33.9-17 17L75 403.1 58 420zM357.8 120.2l-17 17 33.9 33.9 17-17L437 108.9l17-17L420 58l-17 17-45.3 45.3z" />
      </svg>
      }
      <span>Rilevamento automatico</span>
      @if(themeManager.chosenTheme() === 'OS') {
      <svg xmlns="http://www.w3.org/2000/svg" class="h4 w-4 relative left-2"
        viewBox="0 0 512 512"><!--!Font Awesome Pro 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2025 Fonticons, Inc.-->
        <path class="fill-current text-light-accent-secondary dark:text-dark-accent-secondary"
          d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zm126.1 0L160 222.1c.3 .3 .6 .6 1 1c5.3 5.3 10.7 10.7 16 16c15.7 15.7 31.4 31.4 47 47c37-37 74-74 111-111c5.3-5.3 10.7-10.7 16-16c.3-.3 .6-.6 1-1L385.9 192c-.3 .3-.6 .6-1 1l-16 16L241 337l-17 17-17-17-64-64c-5.3-5.3-10.7-10.7-16-16l-1-1z" />
        <path class="fill-current text-slate-50"
          d="M385 193L241 337l-17 17-17-17-80-80L161 223l63 63L351 159 385 193z" />
      </svg>
      }
    </button>
  </div>
</div>
<!-- Offcanvas Navigation Sidebar -->
@if (designService.maxBk('md')()) {
<div class="offcanvas-menu-container fixed top-0 left-0 h-full z-[60] bg-white dark:bg-neutral-800 shadow-lg transform transition-transform duration-300 ease-in-out
         w-full 2xs:w-[74%] xs:w-[64%] sm:w-[55%] md:w-[55%] lg:w-[40%] xl:w-[30%]
         -translate-x-full"
  [ngClass]="{ 'translate-x-0': offCanvasMenuOpen(), '-translate-x-full': !offCanvasMenuOpen() }">

  <!-- Header of the offcanvas -->
  <div
    class="flex justify-between items-center px-5 border-b border-light-border dark:border-dark-border shadow-sm dark:shadow-none">
    <div class="flex gap-4 items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="offcanvas-menu-icon"
        viewBox="0 0 512 512"><!--!Font Awesome Pro 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2025 Fonticons, Inc.-->
        <path class="fill-current text-light-accent-secondary/50 dark:text-slate-100/75"
          d="M0 256a256 256 0 1 0 512 0A256 256 0 1 0 0 256zM128 384l64-192 192-64L320 320 128 384z" />
        <path class="fill-current text-light-accent-primary dark:text-dark-accent-primary" d="M192 192L128 384l192-64 64-192L192 192zm64 32a32 32 0 1 1 0 64 32 32 0 1 1 0-64z" />
      </svg>
      <h2 class="font-semibold text-light-accent-primary dark:text-dark-accent-primary text-2xl py-4">Navigazione</h2>
    </div>
    <button (click)="closeOffCanvasMenu()">
      <svg xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 fill-current text-light-on-surface-secondary dark:text-slate-200" viewBox="0 0 384 512">
        <path
          d="M310.6 361.4L233.3 284.1 310.6 206.7c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L188 238.7 110.6 161.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L142.7 284.1 65.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L188 329.3l77.3 77.3c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3z" />
      </svg>
    </button>
  </div>

  <!-- Menu items -->
  <app-nav (onCloseOffCanvasMenu)="themeMenuOpen.set($event)"></app-nav>
</div>}
