@if (toast.show()) {
      <div
        class="fixed top-4 right-4 z-50 max-w-sm w-full px-4 py-3 rounded-md bg-red-600 text-white shadow-lg transition-all duration-300 transform"
        [class.translate-x-full]="!toast.slideIn()"
        [class.translate-x-0]="toast.slideIn()"
        role="alert"
      >
        <div class="flex justify-between items-start gap-4">
          <p class="text-sm font-medium">{{ toast.message() }}</p>
          <button (click)="toast.close()" class="text-white hover:text-red-200">✕</button>
        </div>
      </div>
    }
