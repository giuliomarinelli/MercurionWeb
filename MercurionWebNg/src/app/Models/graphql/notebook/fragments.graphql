fragment PageFields on NotebookPage {
  id
  title
  content
  order
  createdAt
  updatedAt
}

fragment SectionFields on NotebookSection {
  id
  title
  order
  description
  pages {
    ...PageFields
  }
}

fragment ChapterFields on NotebookChapter {
  id
  title
  order
  sections {
    ...SectionFields
  }
}

fragment NotebookFields on LabNotebook {
  id
  title
  createdAt
  updatedAt
  chapters {
    ...ChapterFields
  }
}
