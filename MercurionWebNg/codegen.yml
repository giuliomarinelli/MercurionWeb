overwrite: true
schema: ../MercurionWebNode/src/schema.graphql
documents: src/app/graphql/documents/**/*.graphql
config:
  enumsAsTypes: true
  useTypeImports: true
  scalars:
    ID:
      input: string
      output: string
    JSON:
      input: ../Models/json.models#JsonValue
      output: ../Models/json.models#JsonValue
generates:
  src/app/generated/schema.ts:
    plugins:
      - add:
          content: "/* This file is generated by GraphQL Code Generator. Do not edit manually. */"
      - typescript
  src/app/generated/graphql.ts:
    plugins:
      - add:
          content: "/* This file is generated by GraphQL Code Generator. Do not edit manually. */"
      - typescript-operations
      - typed-document-node
