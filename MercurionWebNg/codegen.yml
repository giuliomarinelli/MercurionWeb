overwrite: true
schema: ../MercurionWebNode/src/schema.graphql
# Deliberately incremental exact-source allowlist; see GRAPHQL_CODEGEN.md.
documents:
  - src/app/services/graphql/graphql-operations/help.gql-operations.ts
  - src/app/services/graphql/graphql-operations/molecule-item-polymorphic.gql-operations.ts
  - src/app/services/graphql/graphql-operations/molecule-collection.gql-operations.ts
  - src/app/services/graphql/graphql-operations/molecule.gql-queries.ts
  - src/app/services/graphql/molecule-collection-join.service.ts
  - src/app/services/graphql/molecule-search.service.ts
  - src/app/Models/graphql/notebook/fragments.graphql
config:
  enumsAsTypes: true
  useTypeImports: true
  scalars:
    ID:
      input: string
      output: string
    JSON:
      input: ../Models/json.models#JsonValue
      output: ../Models/json.models#JsonValue
generates:
  src/app/generated/schema.ts:
    plugins:
      - add:
          content: "/* This file is generated by GraphQL Code Generator. Do not edit manually. */"
      - typescript
  src/app/generated/graphql.ts:
    plugins:
      - add:
          content: "/* This file is generated by GraphQL Code Generator. Do not edit manually. */"
      - typescript-operations
      - typed-document-node
