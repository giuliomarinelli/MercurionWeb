server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # entrypoint comodo
  location = / {
    return 302 /m/;
  }

  # tutta la SPA vive sotto /m/
  location /m/ {
    try_files $uri $uri/ /m/index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
